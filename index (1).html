<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hammie's Little Park</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Gaegu:wght@400;700&display=swap">
<style>
/* Layout: one 16:9 canvas centred on storyboard grid paper. Single deliberate look (paper + ink), so no dark variant. */
:root{
  --paper:#f6f1e1;
  --grid:#dcd8cc;
  --ink:#3d4183;
  --sun:#ffd36b;
  color-scheme: light;
}
html,body{height:100%}
body{
  margin:0;
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:28px 28px;
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:12px;
  box-sizing:border-box;
  overflow:hidden;
}
canvas{
  display:block;
  border-radius:16px;
  border:2.5px solid var(--ink);
  box-shadow:5px 7px 0 rgba(61,65,131,.18);
  touch-action:none;
  outline:none;
  background:var(--paper);
}
canvas:focus-visible{box-shadow:0 0 0 4px var(--sun),5px 7px 0 rgba(61,65,131,.18)}
</style>
</head>
<body>

<canvas id="c" tabindex="0" aria-label="Hammie's Little Park, a short cozy game. Use arrow keys or tap to move, Space or tap to interact."></canvas>

<script>
(() => {
'use strict';
const W = 960, H = 540;
const INK = '#3d4183', PAPER = '#f6f1e1';
const HAND = '"Gaegu", "Comic Sans MS", cursive';
const ROUND = '"Baloo 2", "Trebuchet MS", system-ui, sans-serif';
const PARK_LIMIT = 120;          // seconds of park play before sunset ends the walk
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let K = 1;
function resize() {
  const aw = Math.max(240, innerWidth - 36), ah = Math.max(135, innerHeight - 28);
  const cw = Math.min(aw, ah * 16 / 9), ch = cw * 9 / 16;
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  K = cv.width / W;
}
addEventListener('resize', resize); resize();

/* ---------- helpers ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const dist = (a, b, c, d) => Math.hypot(a - c, b - d);
const TAU = Math.PI * 2;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
function mix(a, b, t) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; }
function ell(x, y, rx, ry, c, rot = 0) { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, TAU); ctx.fill(); }
function circ(x, y, r, c) { ell(x, y, r, r, c); }
function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function line(x1, y1, x2, y2, c, w) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function heart(x, y, s, c) { ctx.save(); ctx.translate(x, y); ctx.scale(s / 8, s / 8); ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(0, 4); ctx.bezierCurveTo(-9, -2, -4, -10, 0, -4); ctx.bezierCurveTo(4, -10, 9, -2, 0, 4); ctx.fill(); ctx.restore(); }
function star(x, y, s, c) { ctx.save(); ctx.translate(x, y); ctx.fillStyle = c; ctx.beginPath(); for (let i = 0; i < 8; i++) { const r = i % 2 ? s * .35 : s, a = i * Math.PI / 4; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.fill(); ctx.restore(); }
function desat(a, x0 = 0, x1 = W) {
  if (a <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'saturation';
  ctx.fillStyle = `rgba(128,128,128,${a})`; ctx.fillRect(x0, 0, x1 - x0, H); ctx.restore();
}
function vignette(a) {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95);
  g.addColorStop(0, 'rgba(30,30,40,0)'); g.addColorStop(1, `rgba(30,30,40,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

/* ---------- input ---------- */
const keys = {};
let actPressed = false, touchSeen = false;
const ptr = { x: -99, y: -99, down: false, pressed: false };
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (!keys[e.code] && ['Space', 'KeyE', 'Enter'].includes(e.code)) actPressed = true;
  if (!keys[e.code] && e.code === 'KeyM') AU.toggle();
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; ptr.down = false; });
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointerdown', e => {
  const p = toLogical(e); ptr.x = p.x; ptr.y = p.y; ptr.down = true; ptr.pressed = true;
  if (e.pointerType === 'touch') touchSeen = true;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  cv.focus({ preventScroll: true });
  e.preventDefault();
});
cv.addEventListener('pointermove', e => { const p = toLogical(e); ptr.x = p.x; ptr.y = p.y; });
const up = () => { ptr.down = false; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
const held = () => !!(keys.Space || keys.KeyE || keys.Enter || ptr.down);
const inRect = (x, y, w, h) => ptr.x > x && ptr.x < x + w && ptr.y > y && ptr.y < y + h;

/* ---------- audio ---------- */
const AU = {
  ctx: null, muted: false, mode: 'none', step: 0, mel: 3,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    const c = this.ctx = new A();
    this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : .8; this.master.connect(c.destination);
    const dl = c.createDelay(1), fb = c.createGain(), lp = c.createBiquadFilter();
    dl.delayTime.value = .34; fb.gain.value = .3; lp.type = 'lowpass'; lp.frequency.value = 2200;
    dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(this.master);
    this.music = c.createGain(); this.music.gain.value = .55; this.music.connect(this.master); this.music.connect(dl);
    this.sfx = c.createGain(); this.sfx.gain.value = .7; this.sfx.connect(this.master);
    const buf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
    const loop = (freq, type) => { const s = c.createBufferSource(); s.buffer = buf; s.loop = true; const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; const g = c.createGain(); g.gain.value = 0; s.connect(f); f.connect(g); g.connect(this.master); s.start(); return g; };
    this.rainG = loop(1500, 'lowpass');
    this.cityG = loop(160, 'lowpass');
    this.next = c.currentTime + .1;
    setInterval(() => this.schedule(), 90);
  },
  toggle() { this.muted = !this.muted; if (this.master) this.master.gain.setTargetAtTime(this.muted ? 0 : .8, this.ctx.currentTime, .05); },
  set(g, v, time = 1) { if (!this.ctx || !g) return; const p = g.gain, t = this.ctx.currentTime; p.cancelScheduledValues(t); p.setValueAtTime(p.value, t); p.linearRampToValueAtTime(v, t + time); },
  tone(freq, t, dur, type = 'sine', vol = .2, dest) {
    const c = this.ctx; if (!c) return;
    const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(dest || this.sfx); o.start(t); o.stop(t + dur + .05); return o;
  },
  burst(t, dur, freq, type, vol) {
    const c = this.ctx; if (!c) return;
    const s = c.createBufferSource(); s.buffer = this.noise; const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.sfx); s.start(t, Math.random()); s.stop(t + dur + .05);
  },
  now() { return this.ctx ? this.ctx.currentTime : 0; },
  m: n => 440 * Math.pow(2, (n - 69) / 12),
  chime() { const t = this.now(); [72, 76, 79, 84].forEach((n, i) => this.tone(this.m(n), t + i * .08, .9, 'triangle', .13)); },
  fanfare() { const t = this.now(); [65, 69, 72, 77, 81, 84].forEach((n, i) => this.tone(this.m(n), t + i * .11, 1.4, 'triangle', .12)); },
  pop() { const t = this.now(); const o = this.tone(700, t, .15, 'sine', .14); if (o) o.frequency.exponentialRampToValueAtTime(1100, t + .1); },
  purr() { const t = this.now(); for (let i = 0; i < 6; i++) this.burst(t + i * .07, .06, 260, 'lowpass', .25); },
  splash() { this.burst(this.now(), .25, 1300, 'bandpass', .35); },
  drip() { const t = this.now(); const o = this.tone(900 + Math.random() * 400, t, .12, 'sine', .06); if (o) o.frequency.exponentialRampToValueAtTime(1800, t + .1); },
  crunch() { const t = this.now(); for (let i = 0; i < 5; i++) this.burst(t + i * .035, .05, 2600, 'highpass', .22); },
  quack() { const t = this.now(); for (let i = 0; i < 2; i++) { const o = this.tone(520, t + i * .16, .12, 'sawtooth', .05); if (o) o.frequency.exponentialRampToValueAtTime(330, t + i * .16 + .12); } },
  honk() { const t = this.now(); this.tone(330, t, .35, 'square', .025); this.tone(415, t, .35, 'square', .02); },
  chirp(t) { t = t || this.now(); for (let i = 0; i < 3; i++) { const o = this.tone(2600, t + i * .09, .07, 'sine', .035, this.music); if (o) o.frequency.exponentialRampToValueAtTime(3900, t + i * .09 + .06); } },
  breath(up) { const t = this.now(); const o = this.tone(up ? 330 : 440, t, 1.6, 'sine', .05); if (o) o.frequency.linearRampToValueAtTime(up ? 440 : 330, t + 1.5); },
  schedule() {
    const c = this.ctx; if (!c) return;
    while (this.next < c.currentTime + .3) {
      this.playStep(this.next, this.step);
      this.next += this.mode === 'park' ? .34 : this.mode === 'end' ? .42 : .6;
      this.step++;
    }
  },
  playStep(t, s) {
    const m = this.mode, M = this.m; if (m === 'none') return;
    if (m === 'sad') {
      const chords = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [52, 55, 59]];
      if (s % 8 === 0) chords[(s / 8 | 0) % 4].forEach(n => this.tone(M(n), t, 4.2, 'sine', .04, this.music));
      if (s % 2 === 0 && Math.random() < .3) { const sc = [69, 72, 74, 76, 79]; this.tone(M(sc[Math.random() * sc.length | 0]), t, 1.8, 'triangle', .035, this.music); }
    } else {
      const prog = [[53, 57, 60, 64], [50, 53, 57, 60], [46, 50, 53, 57], [48, 52, 55, 60]];
      const ch = prog[(s / 8 | 0) % 4];
      if (s % 8 === 0) { ch.forEach((n, i) => this.tone(M(n), t + i * .03, 3.4, 'sine', .04, this.music)); this.tone(M(ch[0] - 12), t, 2.6, 'triangle', .05, this.music); }
      const pent = [65, 67, 69, 72, 74, 77, 79, 81];
      if (Math.random() < (m === 'end' ? .32 : .48)) {
        this.mel = clamp(this.mel + ((Math.random() * 5 | 0) - 2), 0, pent.length - 1);
        this.tone(M(pent[this.mel]), t, .9, 'triangle', .045, this.music);
      }
      if (m === 'park' && s % 16 === 12 && Math.random() < .5) this.chirp(t);
    }
  }
};

/* ---------- global state ---------- */
const G = { scene: null, name: '', t: 0, time: 0, si: 0, happy: 0, shown: 0, parkT: 0, playT: 0, playing: false, cap: null, fade: 1, next: null };
const SC = {};
function go(n) { if (!G.next) G.next = n; }
function switchScene(n) { G.name = n; G.scene = SC[n]; G.t = 0; G.si = 0; G.cap = null; if (G.scene.enter) G.scene.enter(); }
function say(text, dur) { G.cap = { text, t: 0, dur }; }
function runScript(list) { while (G.si < list.length && G.t >= list[G.si][0]) { const s = list[G.si++]; say(s[1], s[2]); } }

function drawCaption(dt) {
  const c = G.cap; if (!c) return;
  c.t += dt; if (c.t > c.dur) { G.cap = null; return; }
  const a = Math.min(1, c.t * 4, (c.dur - c.t) * 3);
  const shown = c.text.slice(0, Math.floor(c.t * 45));
  ctx.save(); ctx.globalAlpha = a;
  ctx.font = `700 27px ${HAND}`;
  const w = Math.min(W - 60, ctx.measureText(c.text).width + 56);
  const x = (W - w) / 2, y = H - 66;
  rr(x + 3, y + 4, w, 46, 14); ctx.fillStyle = 'rgba(61,65,131,.22)'; ctx.fill();
  rr(x, y, w, 46, 14); ctx.fillStyle = 'rgba(246,241,225,.95)'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke();
  ctx.fillStyle = INK; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(shown, x + 28, y + 24);
  ctx.restore();
}

function button(x, y, w, h, label, useKey) {
  const hov = inRect(x, y, w, h);
  const bob = REDUCED ? 0 : Math.sin(G.time * 3) * 1.5;
  ctx.save();
  rr(x + 3, y + 5 + bob, w, h, h / 2); ctx.fillStyle = 'rgba(61,65,131,.25)'; ctx.fill();
  rr(x, y + bob, w, h, h / 2); ctx.fillStyle = hov ? '#ffe39a' : '#ffd36b'; ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke();
  ctx.fillStyle = INK; ctx.font = `700 24px ${ROUND}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w / 2, y + h / 2 + bob + 2);
  ctx.restore();
  if (hov) cv.style.cursor = 'pointer';
  const hit = (ptr.pressed && hov) || (useKey && actPressed);
  if (hit) { ptr.pressed = false; actPressed = false; }
  return hit;
}

/* ---------- Hammie ---------- */
function drawHammie(x, y, s, o = {}) {
  const mood = o.mood ?? 0, dir = o.dir ?? 1, ph = o.walk ?? 0, moving = !!o.moving, pose = o.pose || 'stand', t = G.time;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ell(0, 0, 21, 6, 'rgba(40,30,20,.18)');
  ctx.translate(0, -(o.lift || 0));
  const step = moving ? Math.sin(ph) : 0;
  const bob = moving ? -Math.abs(Math.sin(ph)) * 3 : (REDUCED ? 0 : Math.sin(t * 2.2) * .8);
  const sq = pose === 'slump' ? .9 : pose === 'sit' ? .94 : 1;
  // feet
  ell(-9, -3 - Math.max(0, step) * 4, 7, 4.5, '#d48a52');
  ell(9, -3 - Math.max(0, -step) * 4, 7, 4.5, '#d48a52');
  ctx.translate(0, bob);
  const lean = pose === 'sniff' ? .12 * dir : pose === 'slump' ? 0 : 0;
  ctx.rotate(lean);
  // backpack peeking behind
  rr(-28, -46 * sq, 56, 28, 10); ctx.fillStyle = '#6b80a8'; ctx.fill();
  // ears
  const ey = -53 * sq;
  circ(-15, ey, 8.5, '#e09a5f'); circ(15, ey, 8.5, '#e09a5f');
  circ(-15, ey, 4.6, '#f3b4a6'); circ(15, ey, 4.6, '#f3b4a6');
  // body
  ell(0, -29 * sq, 23, 29 * sq, '#efb274');
  ell(-6, -40 * sq, 12, 9, 'rgba(255,240,215,.35)');
  ell(0, -19 * sq, 14.5, 14 * sq, '#fbe4c6');
  // backpack straps
  ctx.strokeStyle = '#55688f'; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-13, -48 * sq); ctx.quadraticCurveTo(-17, -32 * sq, -14, -16 * sq); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(13, -48 * sq); ctx.quadraticCurveTo(17, -32 * sq, 14, -16 * sq); ctx.stroke();
  // arms
  const armUp = pose === 'pet' || pose === 'reach' || pose === 'water';
  if (armUp) {
    ell(-19 * -dir, -24 * sq, 5.5, 7.5, '#e7a466', .4 * dir);
    ell(24 * dir, -30 * sq, 8, 5, '#e7a466', -.3 * dir);
  } else if (pose === 'cheer') {
    ell(-21, -44 * sq, 5, 8, '#e7a466', .5); ell(21, -44 * sq, 5, 8, '#e7a466', -.5);
  } else {
    const sw = moving ? Math.sin(ph) * .3 : 0;
    ell(-20, -24 * sq, 5.5, 8, '#e7a466', .35 + sw); ell(20, -24 * sq, 5.5, 8, '#e7a466', -.35 + sw);
  }
  // face
  const fx = dir * 3, fy = -36 * sq;
  const blink = (t % 3.7) < .12;
  const closed = pose === 'sniff' || pose === 'sleep' || pose === 'breathe' || o.closed;
  ctx.strokeStyle = '#2d2a32'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  if (closed) {
    ctx.beginPath(); ctx.arc(fx - 8, fy + 1, 3, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(fx + 8, fy + 1, 3, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else if (blink) {
    line(fx - 11, fy, fx - 5, fy, '#2d2a32', 2); line(fx + 5, fy, fx + 11, fy, '#2d2a32', 2);
  } else {
    circ(fx - 8, fy, 3, '#2d2a32'); circ(fx + 8, fy, 3, '#2d2a32');
    circ(fx - 7, fy - 1.2, 1, '#fff'); circ(fx + 9, fy - 1.2, 1, '#fff');
    if (mood < .25) { ctx.fillStyle = '#efb274'; ctx.fillRect(fx - 12, fy - 5, 24, 3.4); } // heavy lids
  }
  if (mood < .4 && !closed) {
    line(fx - 12, fy - 6, fx - 5, fy - 9, '#8a5a3a', 1.6);
    line(fx + 12, fy - 6, fx + 5, fy - 9, '#8a5a3a', 1.6);
  }
  ctx.globalAlpha = .25 + mood * .45; circ(fx - 14, fy + 7, 4.5, '#f28b8b'); circ(fx + 14, fy + 7, 4.5, '#f28b8b'); ctx.globalAlpha = 1;
  // mouth
  ctx.strokeStyle = '#6b3b2a'; ctx.lineWidth = 1.7;
  const my = fy + 8;
  if (mood > .6 || pose === 'cheer') {
    ctx.beginPath(); ctx.arc(fx - 2.5, my, 2.5, 0, Math.PI); ctx.arc(fx + 2.5, my, 2.5, 0, Math.PI); ctx.stroke();
  } else if (mood > .3) {
    ctx.beginPath(); ctx.moveTo(fx - 3, my + 1); ctx.quadraticCurveTo(fx, my + 3, fx + 3, my + 1); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(fx - 4, my + 3); ctx.quadraticCurveTo(fx, my - 1, fx + 4, my + 3); ctx.stroke();
  }
  if (mood < .2 && pose !== 'sleep') { // sweat drop
    ctx.fillStyle = '#9cc8ee'; ctx.beginPath(); const sx = 21, sy = -58 * sq;
    ctx.moveTo(sx, sy); ctx.quadraticCurveTo(sx + 5, sy + 8, sx, sy + 9); ctx.quadraticCurveTo(sx - 5, sy + 8, sx, sy); ctx.fill();
  }
  ctx.restore();
}

/* ---------- stress cloud ---------- */
function drawCloud(x, y, s, dark, alpha = 1) {
  const top = mix('#ffffff', '#7b818c', dark), base = mix('#eef1f5', '#5d636e', dark);
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(s, s);
  rr(-40, -2, 80, 20, 10); ctx.fillStyle = base; ctx.fill();
  circ(-24, 2, 17, base); circ(0, -8, 23, base); circ(24, 3, 17, base);
  circ(-22, -1, 14, top); circ(-1, -11, 19, top); circ(21, 0, 13, top);
  ctx.restore();
}
function drawSun(x, y, s, a) {
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(s, s);
  ctx.rotate(G.time * .4);
  for (let i = 0; i < 10; i++) { ctx.rotate(TAU / 10); rr(-2.5, -30, 5, 9, 2.5); ctx.fillStyle = '#ffc94d'; ctx.fill(); }
  ctx.rotate(-G.time * .4);
  circ(0, 0, 18, '#ffd36b'); circ(-4, -4, 9, '#ffe7a3');
  circ(-6, 1, 1.8, '#7a4b2a'); circ(6, 1, 1.8, '#7a4b2a');
  ctx.strokeStyle = '#7a4b2a'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(0, 4, 4, .2, Math.PI - .2); ctx.stroke();
  ctx.restore();
}
// rain that falls from a cloud onto Hammie
function makeDrops() { return []; }
function updateDrops(arr, dt, cx, cy, s, rate, groundY) {
  if (Math.random() < rate * dt) arr.push({ x: cx + (Math.random() - .5) * 60 * s, y: cy + 14 * s, v: 260 + Math.random() * 80, g: groundY + (Math.random() - .5) * 8, sp: 0 });
  for (const d of arr) { if (d.sp > 0) d.sp -= dt; else { d.y += d.v * dt; if (d.y >= d.g) { d.y = d.g; d.sp = .25; } } }
  for (let i = arr.length - 1; i >= 0; i--) if (arr[i].sp < 0 || arr.length > 140) arr.splice(i, 1);
}
function drawDrops(arr) {
  for (const d of arr) {
    if (d.sp > 0) { ctx.strokeStyle = `rgba(150,175,215,${d.sp * 3})`; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.ellipse(d.x, d.y, 6 - d.sp * 16, 2 - d.sp * 5, 0, 0, TAU); ctx.stroke(); }
    else line(d.x, d.y, d.x - 1, d.y + 9, 'rgba(130,160,210,.8)', 1.8);
  }
}

  rr(x, y, s, s, 10); ctx.fillStyle = 'rgba(246,241,225,.9)'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke();

  if (AU.muted) line(x + 22, y + 11, x + 28, y + 21, INK, 2), line(x + 28, y + 11, x + 22, y + 21, INK, 2);
  else { ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x + 19, y + 16, 6, -.9, .9); ctx.stroke(); }
}
function muteHit() { if (ptr.pressed && inRect(W - 46, 14, 32, 32)) { ptr.pressed = false; AU.toggle(); } }
function skipIntro() {
  const x = W - 136, y = 14, w = 80, h = 32;
  const hov = inRect(x, y, w, h); if (hov) cv.style.cursor = 'pointer';
  ctx.save(); ctx.globalAlpha = hov ? 1 : .8;

}

/* =========================================================
   STREET  (rainy busy street, then the park appears)
   ========================================================= */
const GATE_X = 1640, STOP_X = 1530;
SC.street = {
  script: [[.5, 'The city is loud, and the rain will not stop.', 3.8], [5, 'Even the clouds follow him home.', 3.4]],
  enter() {
    this.hx = 150; this.walk = 0; this.stopT = -1; this.drops = []; this.cars = []; this.carT = 1.2;
    const r = rng(21);
    this.far = []; for (let x = -100; x < 1500; x += 60 + r() * 70) this.far.push({ x, w: 70 + r() * 70, h: 140 + r() * 140 });
    this.near = []; let x = -60;
    const signs = ['CAFE', 'BOOKS', '24H', 'PRINT', 'NOODLES', 'LAUNDRY', 'PHARMACY', 'BAKERY'];
    const cols = ['#9c8775', '#7c8a98', '#a39581', '#6f7d8b', '#a68d7a', '#8b7f99'];
    let i = 0;
    while (x < GATE_X - 120) { const w = 170 + r() * 90; this.near.push({ x, w, h: 210 + r() * 120, c: cols[i % cols.length], sign: signs[i % signs.length], aw: ['#c0504d', '#4f81bd', '#9bbb59', '#e0a040'][i % 4] }); x += w + 6; i++; }
    this.peds = []; for (let k = 0; k < 11; k++) this.peds.push({ x: 300 + k * 150 + r() * 80, y: 412 + r() * 40, sp: r() < .7 ? -(30 + r() * 30) : 40 + r() * 20, c: ['#3b3f4a', '#4a3f3b', '#2f3b45'][k % 3], u: ['#2f3540', '#5a3a3a', '#31455a', '#444'][k % 4], ph: r() * 6 });
    this.rain = []; for (let k = 0; k < 170; k++) this.rain.push({ x: Math.random() * W, y: Math.random() * H, v: 520 + Math.random() * 260 });
    AU.mode = 'sad'; AU.set(AU.rainG, .22, 1.5); AU.set(AU.cityG, .35, 1.5);
  },
  frame(dt) {
    const t = G.t; runScript(this.script);
    if (this.stopT < 0) {
      this.hx += 113 * dt; this.walk += dt * 9;
      if (this.hx >= STOP_X) {
        this.hx = STOP_X; this.stopT = 0; say('...huh? Was that always here?', 3.2);
        AU.set(AU.cityG, .08, 4); AU.set(AU.rainG, .03, 5); AU.chirp();
      }
    } else {
      this.stopT += dt;
      if (this.stopT > 3.4 && this.stopT - dt <= 3.4) say('A park. Hammie decides to take a little walk.', 4.6);
    }
    const rp = this.stopT < 0 ? 0 : ease(clamp(this.stopT / 4, 0, 1));    // reveal progress
    const cam = clamp(this.hx - 300, 0, GATE_X - 560);
    // sky
    const sky = ctx.createLinearGradient(0, 0, 0, 400);
    sky.addColorStop(0, mix('#8f99a4', '#9fd0ee', rp)); sky.addColorStop(1, mix('#c4c9cc', '#fdf0c8', rp));
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, 400);
    // far skyline
    for (const b of this.far) { const x = b.x - cam * .35; if (x > W || x + b.w < 0) continue; ctx.fillStyle = '#a3abb3'; ctx.fillRect(x, 400 - b.h - 60, b.w, b.h + 60); }
    // near buildings
    for (const b of this.near) {
      const x = b.x - cam; if (x > W || x + b.w < 0) continue;
      const top = 400 - b.h;
      ctx.fillStyle = b.c; ctx.fillRect(x, top, b.w, b.h);
      ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(x, top, b.w, 10);
      for (let wy = top + 24; wy < 300; wy += 42) for (let wx = x + 18; wx < x + b.w - 30; wx += 40) { rr(wx, wy, 24, 28, 3); ctx.fillStyle = (wx * 7 + wy) % 5 < 1 ? '#e8d9a8' : '#c9d2da'; ctx.fill(); }
      ctx.fillStyle = '#5b5f66'; ctx.fillRect(x + 10, 330, b.w - 20, 70);
      ctx.fillStyle = '#c9d6df'; ctx.fillRect(x + 18, 338, b.w - 70, 54);
      ctx.fillStyle = '#3e4248'; ctx.fillRect(x + b.w - 46, 340, 28, 60);
      for (let k = 0; k < b.w - 20; k += 20) { ctx.fillStyle = (k / 20) % 2 ? b.aw : '#efe7d6'; ctx.beginPath(); ctx.moveTo(x + 10 + k, 316); ctx.lineTo(x + 30 + k, 316); ctx.lineTo(x + 30 + k, 330); ctx.quadraticCurveTo(x + 20 + k, 338, x + 10 + k, 330); ctx.fill(); }
      rr(x + b.w / 2 - 44, 286, 88, 24, 4); ctx.fillStyle = '#efe7d6'; ctx.fill();
      ctx.fillStyle = '#3e4248'; ctx.font = `700 16px ${ROUND}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(b.sign, x + b.w / 2, 299);
    }
    // park beyond the gate
    this.drawPark(GATE_X - cam, rp);
    // sidewalk + road
    ctx.fillStyle = '#9d9c96'; ctx.fillRect(0, 400, W, 56);
    for (let x = -((cam) % 80); x < W; x += 80) line(x, 400, x, 456, 'rgba(70,70,70,.2)', 2);
    ctx.fillStyle = '#7d7c77'; ctx.fillRect(0, 456, W, 8);
    ctx.fillStyle = '#5c5f65'; ctx.fillRect(0, 464, W, 76);
    for (let x = -((cam * 1) % 120); x < W; x += 120) { rr(x, 500, 60, 6, 3); ctx.fillStyle = '#d8d6cc'; ctx.fill(); }
    for (let k = 0; k < 6; k++) { const px = ((k * 260 + 90) - cam % 1560 + 1560) % 1560 - 200; ell(px, 430 + (k % 3) * 8, 34, 6, 'rgba(120,135,150,.55)'); }
    // pedestrians + Hammie, sorted by y
    const hsx = this.hx - cam;
    const list = [];
    for (const p of this.peds) {
      p.x += p.sp * dt * (1 - rp * .6); p.ph += dt * 6;
      const sx = p.x - cam; if (sx < -80 || sx > W + 80) continue;
      if (p.x > GATE_X - 40 && p.x < GATE_X + 240) continue;
      list.push({ y: p.y, f: () => this.drawPed(sx, p.y, p) });
    }
    list.push({ y: 440, f: () => drawHammie(hsx, 440, 1, { mood: .05 + rp * .2, dir: 1, walk: this.walk, moving: this.stopT < 0 }) });
    list.sort((a, b) => a.y - b.y).forEach(o => o.f());
    // cars
    this.carT -= dt;
    if (this.carT <= 0 && this.stopT < 0) { this.carT = 1.6 + Math.random() * 2.2; this.cars.push({ x: W + 40, sp: -(260 + Math.random() * 120), c: ['#b6574e', '#5577a6', '#e0b24d', '#6d9a61', '#e8e4dc'][Math.random() * 5 | 0] }); if (Math.random() < .45) AU.honk(); }
    for (const c of this.cars) { c.x += c.sp * dt; this.drawCar(c.x, c.c); }
    this.cars = this.cars.filter(c => c.x > -220);
    // Hammie's own cloud
    const cy = 440 - 105 - (REDUCED ? 0 : Math.sin(G.time * 2) * 3);
    drawCloud(hsx + 6, cy, .85, 1 - rp * .25);
    updateDrops(this.drops, dt, hsx + 6, cy, .85, 14, 440);
    drawDrops(this.drops);
    // city rain
    const ri = 1 - rp * .9;
    for (const d of this.rain) {
      d.y += d.v * dt; d.x -= d.v * .12 * dt;
      if (d.y > H) { d.y = -10; d.x = Math.random() * (W + 80); }
      if (Math.random() > ri) continue;
      line(d.x, d.y, d.x - 2, d.y + 13, 'rgba(210,218,230,.55)', 1.3);
    }
    // grey grading, fading out near the park
    const gx = GATE_X - cam;
    const g = .82 * (1 - rp * .9);
    ctx.save(); ctx.globalCompositeOperation = 'saturation';
    const grad = ctx.createLinearGradient(gx - 220, 0, gx + 60, 0);
    grad.addColorStop(0, `rgba(128,128,128,${g})`); grad.addColorStop(1, `rgba(128,128,128,${g * .12})`);
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H); ctx.restore();
    if (rp < 1) vignette(.4 * (1 - rp));
    // warm light breaking through
    if (rp > 0) {
      ctx.save(); ctx.globalAlpha = rp * .5; ctx.globalCompositeOperation = 'lighter';
      for (let k = 0; k < 4; k++) {
        ctx.fillStyle = 'rgba(255,220,140,.18)'; ctx.beginPath();
        ctx.moveTo(gx + 300 + k * 60, -20); ctx.lineTo(gx + 330 + k * 60, -20); ctx.lineTo(gx - 40 + k * 90, 420); ctx.lineTo(gx - 120 + k * 90, 420); ctx.fill();
      }
      ctx.restore();
    }
    // "?" thought
    if (this.stopT > .3 && this.stopT < 3.4) {
      const a = Math.min(1, (this.stopT - .3) * 3);
      ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = INK; ctx.font = `700 40px ${HAND}`; ctx.textAlign = 'center'; ctx.fillText('?', hsx + 34, 330); ctx.restore();
    }
    if (this.stopT > 4.2) {
      if (button(W - 290, H - 160, 230, 56, 'Take a walk ›', true)) go('park');
    }
    if (this.stopT > 14) go('park');
  },
  drawPed(x, y, p) {
    const s = 1.25, dir = Math.sign(p.sp);
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ell(0, 0, 16, 5, 'rgba(0,0,0,.18)');
    const st = Math.sin(p.ph) * 4;
    line(-4, -4, -4 + st, 0, '#2a2a30', 5); line(4, -4, 4 - st, 0, '#2a2a30', 5);
    rr(-12, -52, 24, 50, 10); ctx.fillStyle = p.c; ctx.fill();
    circ(0, -60, 10, '#d9b99b');
    line(8 * dir, -40, 2 * dir, -82, '#222', 2);
    ctx.fillStyle = p.u; ctx.beginPath(); ctx.arc(2 * dir, -82, 32, Math.PI, 0); ctx.quadraticCurveTo(2 * dir + 16, -76, 2 * dir, -82); ctx.quadraticCurveTo(2 * dir - 16, -76, 2 * dir - 32, -82); ctx.fill();
    ctx.restore();
  },
  drawCar(x, c) {

    this.ff = []; for (let i = 0; i < 26; i++) this.ff.push({ x: Math.random() * W, y: 300 + Math.random() * 200, ph: Math.random() * 6 });

    this.card = false; this.note = false; this.cardT = 0; this.noteT = 0;
  },
  frame(dt) {
    const t = G.t; runScript(this.script);
    if (t > 14.6 && !this.note) { this.note = true; G.playing = false; }
    if (this.note && !this.card) { this.noteT += dt; if (this.noteT > 16) this.card = true; }
    if (this.card) this.cardT += dt;
    const hx = lerp(150, 724, ease(clamp(t / 13.5, 0, 1)));
    const moving = t < 13.3;
    // sky
    const sky = ctx.createLinearGradient(0, 0, 0, 380);
    sky.addColorStop(0, '#5f5c95'); sky.addColorStop(.38, '#c9798f'); sky.addColorStop(.72, '#f5a65b'); sky.addColorStop(1, '#ffd89e');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, 380);
    circ(560, 330, 70, 'rgba(255,236,170,.35)'); circ(560, 330, 52, '#ffe08a');
    for (const [cx, cy, s] of [[180, 90, 1.3], [420, 60, .9], [780, 110, 1.1]]) { ctx.save(); ctx.globalAlpha = .55; drawCloud(cx + Math.sin(G.time * .2 + cx) * 10, cy, s, 0); ctx.restore(); }
    // far city with warm windows
    const r = rng(41);
    for (let x = -20; x < 380; x += 40 + r() * 30) { const bh = 60 + r() * 90; ctx.fillStyle = '#7a5f86'; ctx.fillRect(x, 340 - bh, 44, bh + 20); for (let wy = 350 - bh; wy < 330; wy += 16) if (r() < .45) { ctx.fillStyle = '#ffd36b'; ctx.fillRect(x + 8 + (r() * 3 | 0) * 10, wy, 6, 8); } }
    // hills
    ctx.fillStyle = '#a7697b'; ctx.beginPath(); ctx.moveTo(0, 380); for (let x = 0; x <= W; x += 40) ctx.lineTo(x, 350 - Math.sin(x * .01) * 18); ctx.lineTo(W, 380); ctx.fill();
    for (const [x, s] of [[90, .8], [300, 1], [470, .7], [880, .9]]) { ctx.save(); ctx.translate(x, 360); ctx.scale(s, s); circ(0, -40, 34, '#6b4c6a'); circ(-22, -24, 24, '#6b4c6a'); circ(22, -24, 24, '#6b4c6a'); ctx.fillStyle = '#5b3f58'; ctx.fillRect(-5, -14, 10, 20); ctx.restore(); }
    // ground
    ctx.fillStyle = '#86965a'; ctx.fillRect(0, 370, W, H - 370);
    ctx.fillStyle = 'rgba(255,190,120,.18)'; ctx.fillRect(0, 370, W, 40);
    ctx.fillStyle = '#d9a066'; ctx.beginPath(); ctx.moveTo(0, 440); ctx.quadraticCurveTo(400, 420, 760, 436); ctx.lineTo(760, 476); ctx.quadraticCurveTo(400, 462, 0, 488); ctx.fill();
    const fr = rng(43);
    for (let i = 0; i < 40; i++) { const x = fr() * W, y = 380 + fr() * 150; if (y > 420 && y < 490 && x < 780) continue; circ(x, y, 3, ['#f28b8b', '#f7d85a', '#f6f1e1', '#c79be0'][i % 4]); }
    // home
    this.drawHouse(810, 450);
    // Hammie walking home
    drawHammie(hx, 458, 1.1, { mood: this.full ? 1 : .55, dir: 1, walk: t * 9, moving, pose: !moving && this.full ? 'cheer' : null });
    for (const b of this.orbit) SC.park.drawBfly({ x: hx + Math.cos(G.time * 1.8 + b.ph * 2) * 40, y: 386 + Math.sin(G.time * 2.6 + b.ph) * 14, ph: b.ph, c: b.c });
    if (this.full) drawSun(hx + 6, 344 + Math.sin(G.time * 2) * 4, .55, 1);
    else drawCloud(hx + 6, 350 + Math.sin(G.time * 2) * 3, .45, .1);
    // fireflies
    for (const f of this.ff) { const a = (Math.sin(G.time * 2 + f.ph) + 1) / 2; circ(f.x + Math.sin(G.time * .7 + f.ph) * 12, f.y + Math.cos(G.time * .5 + f.ph) * 8, 2.4, `rgba(255,236,150,${a * clamp(t / 4, 0, 1)})`); }
    // warm wash
    ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = 'rgba(255,150,90,.35)'; ctx.fillRect(0, 0, W, H); ctx.restore();
    if (this.card) this.drawCard();
    else if (this.note) this.drawNote();
  },
  drawHouse(x, y) {
    ell(x + 50, y + 4, 80, 10, 'rgba(60,40,40,.25)');
    ctx.fillStyle = '#f1d3a5'; ctx.fillRect(x - 10, y - 80, 120, 82);
    ctx.fillStyle = '#b5534a'; ctx.beginPath(); ctx.moveTo(x - 24, y - 78); ctx.lineTo(x + 50, y - 130); ctx.lineTo(x + 124, y - 78); ctx.fill();
    ctx.fillStyle = '#8f4a3c'; ctx.fillRect(x + 78, y - 128, 14, 30);
    for (let i = 0; i < 3; i++) { const k = (G.time * .3 + i / 3) % 1; circ(x + 85 + Math.sin(k * 6) * 6, y - 134 - k * 50, 6 + k * 8, `rgba(240,230,230,${.5 * (1 - k)})`); }
    rr(x + 4, y - 44, 26, 46, 4); ctx.fillStyle = '#7a4b2a'; ctx.fill(); circ(x + 24, y - 20, 2, '#ffd36b');
    const g = ctx.createRadialGradient(x + 76, y - 44, 4, x + 76, y - 44, 60); g.addColorStop(0, 'rgba(255,214,110,.6)'); g.addColorStop(1, 'rgba(255,214,110,0)'); ctx.fillStyle = g; ctx.fillRect(x + 16, y - 104, 120, 120);
    rr(x + 58, y - 60, 36, 30, 4); ctx.fillStyle = '#ffd36b'; ctx.fill(); line(x + 76, y - 60, x + 76, y - 30, '#c9a26a', 2.5); line(x + 58, y - 45, x + 94, y - 45, '#c9a26a', 2.5);
  },
  drawNote() {
    const a = clamp(this.noteT * 2, 0, 1);
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(40,30,50,.4)'; ctx.fillRect(0, 0, W, H);
    const w = 820, h = 446, x = (W - w) / 2, y = 38;
    rr(x + 5, y + 7, w, h, 20); ctx.fillStyle = 'rgba(61,65,131,.3)'; ctx.fill();
    rr(x, y, w, h, 20); ctx.fillStyle = PAPER; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke();
    ctx.save(); rr(x, y, w, h, 20); ctx.clip(); ctx.strokeStyle = 'rgba(160,160,175,.25)'; ctx.lineWidth = 1; for (let gx = x; gx < x + w; gx += 26) { ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx, y + h); ctx.stroke(); } for (let gy = y; gy < y + h; gy += 26) { ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x + w, gy); ctx.stroke(); } ctx.restore();
    circ(x + w - 70, y + 66, 46, 'rgba(255,224,130,.45)');
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#7d8a2e'; ctx.font = `700 46px ${ROUND}`; ctx.fillText('Why parks help', x + 44, y + 70);
    const lines = [
      'Green spaces give a busy mind a break from noise and screens.',
      'Studies link time in parks to lower stress and a better mood.',
      "Even about 20 minutes outside can lower the body's stress hormones.",
      'A short walk among trees can help you focus and sleep better.',
      'Parks give everyone in the city a free place to rest, move and meet.',
    ];
    ctx.font = `700 22px ${HAND}`; ctx.fillStyle = INK;
    lines.forEach((l, i) => {
      const k = clamp(this.noteT * 1.6 - .4 - i * .45, 0, 1);
      ctx.save(); ctx.globalAlpha = a * k;
      const ly = y + 122 + i * 46;
      ctx.save(); ctx.translate(x + 58, ly - 8); ctx.rotate(-.6); ell(0, 0, 9, 5, '#7fb556'); line(-8, 0, 8, 0, '#5c8e3f', 1.4); ctx.restore();
      ctx.fillText(l, x + 82, ly);
      ctx.restore();
    });
    const k = clamp(this.noteT * 1.6 - 2.8, 0, 1);
    ctx.save(); ctx.globalAlpha = a * k;
    ctx.font = `700 27px ${HAND}`; ctx.fillStyle = '#b5534a'; ctx.textAlign = 'center';
    ctx.fillText('When the clouds follow you, find a little park.', W / 2, y + 368);
    ctx.restore();
    ctx.restore();
    if (this.noteT > 2 && button(W / 2 - 100, y + h - 64, 200, 48, 'Continue ›', true)) this.card = true;
  },
  drawCard() {
    const a = clamp(this.cardT * 3, 0, 1);
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(40,30,50,.35)'; ctx.fillRect(0, 0, W, H);
    const x = W / 2 - 290, y = 92, w = 580, h = 330;
    rr(x + 5, y + 7, w, h, 20); ctx.fillStyle = 'rgba(61,65,131,.3)'; ctx.fill();
    rr(x, y, w, h, 20); ctx.fillStyle = PAPER; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke();
    ctx.save(); rr(x, y, w, h, 20); ctx.clip(); ctx.strokeStyle = 'rgba(160,160,175,.25)'; ctx.lineWidth = 1; for (let gx = x; gx < x + w; gx += 26) { ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx, y + h); ctx.stroke(); } for (let gy = y; gy < y + h; gy += 26) { ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x + w, gy); ctx.stroke(); } ctx.restore();
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#7d8a2e'; ctx.font = `700 60px ${ROUND}`; ctx.fillText('The End', W / 2, y + 82);
    ctx.fillStyle = INK; ctx.font = `700 28px ${HAND}`;
    ctx.fillText(this.full ? 'Hammie made it home happy.' : 'Hammie made it home a little lighter.', W / 2, y + 126);
    ctx.font = `400 20px ${HAND}`;
    const secs = Math.round(G.playT), mm = Math.floor(secs / 60), ss = String(secs % 60).padStart(2, '0');
    ctx.fillText(`happiness ${Math.round(G.happy)}%  ·  ${this.moments} of 7 park moments  ·  ${mm}:${ss} played`, W / 2, y + 168);
    rr(W / 2 - 150, y + 186, 300, 16, 8); ctx.fillStyle = '#fffaf0'; ctx.fill();
    rr(W / 2 - 150, y + 186, 300 * G.happy / 100, 16, 8); ctx.fillStyle = '#f7b267'; ctx.fill();
    rr(W / 2 - 150, y + 186, 300, 16, 8); ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke();
    ctx.restore();
    if (a >= 1 && button(W / 2 - 110, y + 236, 220, 56, 'Play again', true)) go('title');
  }
};

/* ---------- main loop ---------- */
switchScene('title');
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  G.time += dt; G.t += dt; if (G.playing) G.playT += dt;
  cv.style.cursor = 'default';
  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  muteHit();
  G.scene.frame(dt);
  drawCaption(dt);
  if (G.name !== 'title') { drawMute(); if ((G.name === 'library' || G.name === 'street') && !G.next) skipIntro(); }
  // fade
  if (G.next) { G.fade = Math.min(1, G.fade + dt * 2.2); if (G.fade >= 1) { const n = G.next; G.next = null; switchScene(n); } }
  else G.fade = Math.max(0, G.fade - dt * 1.6);
  if (G.fade > 0) { ctx.fillStyle = `rgba(246,241,225,${G.fade})`; ctx.fillRect(0, 0, W, H); }
  actPressed = false; ptr.pressed = false;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__hammie = { G, get P() { return P; }, go: switchScene, SC };
})();
</script>
